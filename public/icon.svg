<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ea580c" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Background Rounded Card matching Navbar bg-primary/10 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#fed7aa" stroke-width="8" />
  <!-- Exact Lucide Droplet from InstalBloc Logo scaled from 24x24 to 512x512 -->
  <g transform="translate(40, 28) scale(18)" filter="url(#dropShadow)">
    <path
      d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"
      fill="url(#dropGrad)"
      stroke="#ea580c"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Subtle inner highlight -->
    <path
      d="M9.2 14.5a3.8 3.8 0 0 0 2.3 3.8"
      fill="none"
      stroke="#ffedd5"
      stroke-width="1.3"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>
</svg>
